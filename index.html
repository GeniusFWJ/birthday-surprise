<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FBF3E6">
<title>致清清 · 生日快乐</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
  }
  body {
    font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", "PingFang SC", serif;
    color: #6B4F3A;
    background: #FBF3E6;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ============ 背景 ============ */
  .bg {
    position: fixed; inset: 0; z-index: -3;
    background:
      radial-gradient(900px 700px at 15% 8%, rgba(255,252,246,.95), rgba(255,252,246,0) 65%),
      radial-gradient(900px 700px at 88% 92%, rgba(247,222,187,.85), rgba(247,222,187,0) 62%),
      linear-gradient(158deg, #FDF7EE 0%, #F9E9D4 48%, #F3DFC2 100%);
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(178,144,100,.13) 1px, transparent 1.2px);
    background-size: 4px 4px;
    opacity: .5;
  }

  /* ============ 花瓣 ============ */
  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .petal-wrap {
    position: absolute; top: 0;
    animation: fallDown linear infinite;
    will-change: transform;
  }
  @keyframes fallDown {
    0%   { transform: translateY(-14vh) rotate(0deg); }
    100% { transform: translateY(114vh) rotate(360deg); }
  }
  .petal {
    display: block; width: 100%; height: 100%;
    border-radius: 62% 8% 62% 8%;
    background: linear-gradient(135deg, rgba(255,213,220,.95), rgba(255,236,214,.72));
    box-shadow: 0 0 8px rgba(255,198,198,.35);
    animation: sway ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes sway {
    0%   { transform: translateX(-16px) rotate(-30deg) scale(1); }
    100% { transform: translateX(16px) rotate(34deg) scale(.82); }
  }

  /* ============ 舞台 ============ */
  #stage { position: fixed; inset: 0; z-index: 2; }

  .page {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 3.5vh 6vw;
    opacity: 0; visibility: hidden;
    transform: translateY(16px);
    transition: opacity .9s cubic-bezier(.22,.61,.36,1),
                transform .9s cubic-bezier(.22,.61,.36,1),
                visibility .9s;
    pointer-events: none;
  }
  .page.active {
    opacity: 1; visibility: visible; transform: none;
    pointer-events: auto;
  }

  /* ============ 封面 ============ */
  .cover-inner {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 0 4vw;
  }
  .cover-orn {
    font-size: 1.05rem; color: #DCB878; letter-spacing: .4em;
    text-indent: .4em; margin-bottom: 20px;
    opacity: 0;
  }
  .cover-title {
    font-size: clamp(1.7rem, 8vw, 2.15rem);
    font-weight: 600; letter-spacing: .16em; text-indent: .16em;
    color: #7A5B3E;
    opacity: 0;
  }
  .cover-rule {
    width: 0; height: 1px; margin: 22px 0 24px;
    background: linear-gradient(90deg, transparent, #E2BD83, transparent);
  }
  .cover-sub {
    font-size: .84rem; line-height: 2.05; letter-spacing: .1em;
    color: #97795B;
    opacity: 0;
  }
  .start-btn {
    margin-top: 42px;
    padding: 13px 42px;
    font-family: inherit; font-size: .86rem;
    letter-spacing: .3em; text-indent: .3em;
    color: #7A5B3E;
    background: linear-gradient(160deg, #FFFDF8, #F7E6CC);
    border: 1px solid rgba(214,178,124,.75);
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 12px 28px -14px rgba(160,120,64,.85),
                inset 0 1px 0 rgba(255,255,255,.95);
    opacity: 0;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .start-btn:active {
    transform: scale(.96);
    box-shadow: 0 6px 16px -10px rgba(160,120,64,.85),
                inset 0 1px 0 rgba(255,255,255,.95);
  }

  .page-cover.active .cover-orn      { animation: riseIn 1s ease .15s forwards; }
  .page-cover.active .cover-title    { animation: riseIn 1.1s ease .45s forwards; }
  .page-cover.active .cover-rule     { animation: growLine 1.4s ease .85s forwards; }
  .page-cover.active .cover-sub:nth-of-type(1) { animation: riseIn 1s ease 1.1s forwards; }
  .page-cover.active .cover-sub:nth-of-type(2) { animation: riseIn 1s ease 1.4s forwards; }
  .page-cover.active .start-btn      { animation: riseIn 1s ease 1.85s forwards; }

  @keyframes growLine { to { width: 158px; } }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  /* ============ 照片卡片（照片统一 1:1） ============ */
  .card {
    width: min(360px, 84vw, 48vh);
    max-height: 92vh;
    display: flex; flex-direction: column;
    padding: 16px 16px 22px;
    background: linear-gradient(170deg, rgba(255,253,248,.92), rgba(253,244,231,.84));
    border: 1px solid rgba(210,178,136,.42);
    border-radius: 20px;
    box-shadow:
      0 22px 48px -18px rgba(150,112,66,.42),
      0 2px 6px rgba(150,112,66,.06),
      inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    opacity: 0;
  }
  .page.active .card {
    animation: cardIn .95s cubic-bezier(.22,.61,.36,1) .12s both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(22px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }

  /* 1:1 照片框 */
  .photo-frame {
    flex: 0 0 auto;
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    padding: 9px;
    background: #FFFDF9;
    border: 1px solid rgba(228,206,176,.7);
    border-radius: 12px;
    box-shadow: 0 10px 26px -14px rgba(140,105,62,.65),
                inset 0 1px 0 rgba(255,255,255,.9);
  }
  .photo-inner {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 7px;
    overflow: hidden;
    background: linear-gradient(140deg, #F6E7D2, #EFD7B6);
  }
  .photo-inner img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    z-index: 2;
  }
  .photo-holder {
    position: absolute; inset: 0;
    z-index: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 14px;
    font-size: .74rem; line-height: 1.9;
    letter-spacing: .16em;
    color: rgba(150,118,82,.72);
    text-align: center;
    background-image: repeating-linear-gradient(45deg,
      rgba(255,255,255,.4) 0 8px, rgba(255,255,255,0) 8px 16px);
  }

  .text-area {
    flex: 0 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 6px 0;
    text-align: center;
    -webkit-overflow-scrolling: touch;
  }
  .text-area::-webkit-scrollbar { width: 0; height: 0; }

  .p-title {
    display: inline-block;
    font-size: 1.02rem;
    font-weight: 600;
    letter-spacing: .22em;
    text-indent: .22em;
    color: #7A5B3E;
  }
  .p-title::after {
    content: "";
    display: block;
    width: 34px; height: 2px;
    margin: 9px auto 0;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(242,200,121,0), #E8B96A, rgba(242,200,121,0));
  }

  .lines { text-align: center; margin-top: 10px; }
  .line {
    font-size: .875rem;
    line-height: 1.95;
    letter-spacing: .075em;
    color: #8A6C51;
    opacity: 0;
    animation: lineIn .8s ease forwards;
  }
  @keyframes lineIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .line.typing::after {
    content: "";
    display: inline-block;
    width: 2px; height: .92em;
    vertical-align: -.1em;
    margin-left: 3px;
    background: #D9AE6A;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

  /* ============ 结尾页 ============ */
  .end-inner {
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    padding: 0 6vw;
    max-width: 440px;
    max-height: 94vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .end-inner::-webkit-scrollbar { width: 0; height: 0; }

  .end-photo-wrap {
    margin-bottom: 12px;
    opacity: 0;
    animation: riseIn .9s ease .15s forwards;
  }
  .end-photo-ring {
    position: relative;
    width: min(104px, 24vw, 13vh);
    height: min(104px, 24vw, 13vh);
    padding: 5px;
    border-radius: 50%;
    background: linear-gradient(140deg, #F7DFB5, #E8BE7E 45%, #F7DFB5);
    box-shadow:
      0 12px 30px -14px rgba(160,120,64,.75),
      inset 0 1px 0 rgba(255,255,255,.85);
  }
  .end-photo-ring::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(224, 186, 128, .55);
    animation: ringPulse 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: .5; }
    50%      { transform: scale(1.07); opacity: .95; }
  }
  .end-photo-ring img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: linear-gradient(140deg, #F6E7D2, #EFD7B6);
  }

  .end-big {
    font-size: clamp(1.5rem, 7.6vw, 2rem);
    font-weight: 600;
    letter-spacing: .14em;
    text-indent: .14em;
    color: #B77E3E;
    margin: 4px 0 2px;
    opacity: 0;
    text-shadow:
      0 1px 0 rgba(255,255,255,.7),
      0 4px 16px rgba(220,175,105,.35);
    animation:
      riseIn 1s ease .5s forwards,
      bigBreath 4.6s ease-in-out 1.6s infinite;
  }
  @keyframes bigBreath {
    0%, 100% {
      text-shadow: 0 1px 0 rgba(255,255,255,.7),
                   0 4px 16px rgba(220,175,105,.32);
    }
    50% {
      text-shadow: 0 1px 0 rgba(255,255,255,.85),
                   0 4px 26px rgba(220,175,105,.7);
    }
  }

  .end-rule {
    width: 92px; height: 1px;
    margin: 12px 0 4px;
    background: linear-gradient(90deg, transparent, #DDB77E, transparent);
    opacity: 0;
    transform: scaleX(.2);
    animation: growLine2 1s ease .8s forwards;
  }
  @keyframes growLine2 {
    to { opacity: 1; transform: scaleX(1); }
  }

  .end-inner .lines { margin-top: 10px; }
  .end-inner .line { font-size: .82rem; line-height: 1.98; }

  /* 结尾页按钮组 */
  .end-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity .8s ease, transform .8s ease, visibility .8s;
    pointer-events: none;
  }
  .end-actions.show {
    opacity: 1;
    visibility: visible;
    transform: none;
    pointer-events: auto;
  }
  .end-btn {
    padding: 11px 26px;
    font-family: inherit;
    font-size: .78rem;
    letter-spacing: .22em;
    text-indent: .22em;
    color: #7A5B3E;
    background: linear-gradient(160deg, #FFFDF8, #F7E6CC);
    border: 1px solid rgba(214,178,124,.75);
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 10px 24px -14px rgba(160,120,64,.85),
                inset 0 1px 0 rgba(255,255,255,.95);
    transition: transform .22s ease, box-shadow .22s ease;
  }
  .end-btn:active {
    transform: scale(.95);
  }
  .end-btn.primary {
    color: #8A5E2A;
    background: linear-gradient(160deg, #FFF6E2, #F5D9A8);
    border-color: rgba(206,160,92,.9);
  }
  .end-actions.show .end-btn.primary {
    animation: eggPulse 2.4s ease-in-out 1.4s infinite;
  }
  @keyframes eggPulse {
    0%, 100% {
      box-shadow: 0 10px 24px -14px rgba(160,120,64,.85),
                  inset 0 1px 0 rgba(255,255,255,.95);
    }
    50% {
      box-shadow: 0 10px 32px -8px rgba(224,168,88,.95),
                  inset 0 1px 0 rgba(255,255,255,.95);
    }
  }

  /* ============ 提示 ============ */
  .hint {
    position: absolute;
    bottom: 3vh; left: 50%;
    transform: translateX(-50%);
    font-size: .67rem;
    letter-spacing: .32em;
    text-indent: .32em;
    white-space: nowrap;
    color: #96795B;
    opacity: 0;
    transition: opacity .9s ease;
    pointer-events: none;
  }
  .hint.show {
    opacity: .72;
    animation: hintPulse 2.6s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-4px); }
  }

  /* ============ 音乐按钮 ============ */
  #musicToggle {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    z-index: 10;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(214,178,124,.6);
    background: rgba(255,253,248,.75);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: #A58560;
    font-size: 15px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease, color .3s ease;
  }
  #musicToggle.visible { opacity: 1; pointer-events: auto; }
  #musicToggle.off { color: #CDB99F; }
  #musicToggle .on-note { display: block; animation: noteBeat 1.6s ease-in-out infinite; }
  #musicToggle.off .on-note { display: none; }
  #musicToggle .off-note { display: none; }
  #musicToggle.off .off-note { display: block; }
  @keyframes noteBeat {
    0%,100% { transform: translateY(0) scale(1); }
    50%     { transform: translateY(-2px) scale(1.08); }
  }

  /* ============ 视频彩蛋弹层 ============ */
  #videoModal {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vw;
    background: rgba(42, 29, 18, .82);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .45s ease, visibility .45s;
  }
  #videoModal.open {
    opacity: 1;
    visibility: visible;
  }
  .video-box {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 220px;
    min-height: 130px;
    max-width: 92vw;
    max-height: 84vh;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.8);
    transform: scale(.94);
    transition: transform .45s cubic-bezier(.22,.61,.36,1);
  }
  #videoModal.open .video-box { transform: none; }
  .video-box video {
    display: block;
    width: auto;
    height: auto;
    max-width: 92vw;
    max-height: 84vh;
    background: #000;
  }
  .video-close {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 3;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border: none;
    border-radius: 50%;
    background: rgba(255,253,248,.9);
    color: #6B4F3A;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
    transition: transform .2s ease;
  }
  .video-close:active { transform: scale(.9); }
</style>
</head>
<body>

<div class="bg"></div>
<div id="petals"></div>
<div id="stage"></div>

<button id="musicToggle" type="button" aria-label="背景音乐开关">
  <span class="on-note">♪</span>
  <span class="off-note">♪</span>
</button>

<!-- ============================================================
     背景音乐：把你自己的 mp3 放到 music/bgm.mp3
     也可以直接改下面的 src 路径
     ============================================================ -->
<audio id="bgm" loop preload="auto" src="music/bgm.mp3"></audio>

<!-- ============================================================
     彩蛋视频弹层：把你的视频放到 videos/easter-egg.mp4
     也可以直接改下面的 src 路径
     ============================================================ -->
<div id="videoModal">
  <div class="video-box">
    <button class="video-close" type="button" aria-label="关闭">×</button>
    <video id="eggVideo" src="videos/easter-egg.mp4"
           controls playsinline preload="metadata"></video>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* =========================================================
     1. 内容配置 —— 15 张照片 + 结尾第 16 张
     照片路径：photos/01.jpg ~ photos/16.jpg（全部按 1:1 裁切展示）
     ========================================================= */
  var pages = [
    /* 0 封面 */
    { type: "cover" },

    /* 1 */
    { img: "photos/01.jpg", alt: "第 1 张 · 婴儿 / 百天照", title: "清清，你来了",
      lines: [
        "你初来人间，像一颗小星星。",
        "从那天起，家里有了笑声，世界多了一盏灯。"
      ] },

    /* 2 */
    { img: "photos/02.jpg", alt: "第 2 张 · 幼儿 / 童年照", title: "小小脚步",
      lines: [
        "你学会奔跑，也学会撒娇。",
        "摔过跤，哭过鼻子，还是把童年过得热热闹闹。"
      ] },

    /* 3 */
    { img: "photos/03.jpg", alt: "第 3 张 · 小学 / 少女照", title: "慢慢长大",
      lines: [
        "你背起书包，也背起小小的梦想。",
        "有过倔强，有过迷茫，却一直善良。"
      ] },

    /* 4 家人 */
    { img: "photos/04.jpg", alt: "第 4 张 · 全家福 / 爸妈和滨滨", title: "家的光",
      lines: [
        "谢谢爸妈，把岁月熬成温柔的光，",
        "把你和滨滨，一步一步护着成长。",
        "一个家，两份牵挂，",
        "妹妹是童年玩伴，也是长大后的靠山呀。",
        "前半生，他们护你长大；",
        "后半生，你陪他们把平凡日子开出花。"
      ] },

    /* 5 珠海 */
    { img: "photos/05.jpg", alt: "第 5 张 · 珠海 · 大学", title: "珠海的风",
      lines: [
        "珠海的风，吹过你的大学时光。",
        "你第一次离家，也第一次独自成长。",
        "海很宽，路很长，",
        "你把青春走成了自己的模样。"
      ] },

    /* 6 悉尼 */
    { img: "photos/06.jpg", alt: "第 6 张 · 悉尼 · 硕士", title: "悉尼的夜",
      lines: [
        "悉尼的夜，亮着异乡的灯火。",
        "你一个人上课、回家，熬过想家的时刻。",
        "可你也看过更远的海、更大的世界，",
        "那些吃过的苦，后来都成了你的底色。"
      ] },

    /* 7 一个人 */
    { img: "photos/07.jpg", alt: "第 7 张 · 悉尼 · 一个人生活", title: "一个人，也走了很远",
      lines: [
        "一个人搬过家，一个人等过车，",
        "一个人把委屈咽下，也把风景看过。",
        "你不是天生坚强，",
        "只是走着走着，就长出了翅膀。"
      ] },

    /* 8 看世界 */
    { img: "photos/08.jpg", alt: "第 8 张 · 旅行 / 看海 / 山野", title: "去看世界",
      lines: [
        "你去过海边，也吹过山风。",
        "把笑声留在照片里，把故事装进心中。",
        "世界很大，你一步一步，",
        "走成了自己的光。"
      ] },

    /* 9 朋友 */
    { img: "photos/09.jpg", alt: "第 9 张 · 和朋友合照", title: "朋友与风",
      lines: [
        "朋友在左，快乐在右，",
        "你们把青春走成一场热闹的远游。",
        "多年以后再看，仍会笑着泪流。"
      ] },

    /* 10 科创 */
    { img: "photos/10.jpg", alt: "第 10 张 · 科创集团 · 那一年", title: "工作第一年",
      lines: [
        "工作第一年，你忙过也拼过。",
        "新环境、新节奏，你一点点扛过。",
        "没有白走的路，每一步都算数。"
      ] },

    /* 11 道滘 */

    { img: "photos/13.jpg", alt: "第 13 张 · 我们的第一张合照", title: "人海相逢",

    { img: "photos/14.jpg", alt: "第 14 张 · 我们的日常", title: "平常日子",

    { img: "photos/15.jpg", alt: "第 15 张 · 近期合照 / 牵手背影", title: "二十九岁，下一页是我们",
      lines: [
        "29 岁，不是告别青春，",
        "是把故事写得更认真。",

    /* 16 结尾 */
    { type: "end",
      img: "photos/16.jpg",
      bigTitle: "清澜，生日快乐！",
      lines: [

        "感恩家人和自己，",
        "有朋友可想念，",
        "有此刻可珍惜，",
        "有未来可奔赴，",
        "也有我，陪你走接下来的每一步。",
        "",
        "生日快乐！",
        "从这一岁开始，我们并肩，慢慢走。"
      ] }
  ];

  /* =========================================================
     2. 花瓣
     ========================================================= */
  (function createPetals() {
    var layer = document.getElementById("petals");
    var COUNT = window.innerWidth < 480 ? 46 : 62;

    for (var i = 0; i < COUNT; i++) {
      var wrap = document.createElement("div");
      wrap.className = "petal-wrap";

      var size = 6 + Math.random() * 12;
      var dur = 11 + Math.random() * 18;
      var delay = -Math.random() * dur;

      wrap.style.left = (Math.random() * 100) + "vw";
      wrap.style.width = size + "px";
      wrap.style.height = size + "px";
      wrap.style.animationDuration = dur + "s";
      wrap.style.animationDelay = delay + "s";
      wrap.style.opacity = (0.42 + Math.random() * 0.5).toFixed(2);

      var petal = document.createElement("span");
      petal.className = "petal";
      petal.style.animationDuration = (3.0 + Math.random() * 4.5).toFixed(2) + "s";
      petal.style.animationDelay = (-Math.random() * 7).toFixed(2) + "s";

      var r = Math.random();
      if (r < 0.36) {
        petal.style.background = "linear-gradient(135deg, rgba(255,204,214,.95), rgba(255,236,214,.7))";
      } else if (r < 0.7) {
        petal.style.background = "linear-gradient(135deg, rgba(255,228,206,.95), rgba(252,238,216,.7))";
      } else {
        petal.style.background = "linear-gradient(135deg, rgba(255,240,205,.92), rgba(255,226,196,.68))";
      }

      wrap.appendChild(petal);
      layer.appendChild(wrap);
    }
  })();

  /* =========================================================
     3. 构建页面
     ========================================================= */
  var stage = document.getElementById("stage");
  var pageEls = [];
  var currentIndex = 0;
  var waitingForTap = true;
  var started = false;
  var startDelayTimer = null;

  function buildPage(p) {
    var page = document.createElement("section");
    page.className = "page";

    if (p.type === "cover") {
      page.classList.add("page-cover");
      page.innerHTML =
        '<div class="cover-inner">' +
          '<div class="cover-orn">❦</div>' +
          '<h1 class="cover-title">致亲爱的清清</h1>' +
          '<div class="cover-rule"></div>' +
          '<p class="cover-sub">那个善良、爱笑又认真的女孩。</p>' +
          '<p class="cover-sub">今天，我想陪你把走过的路，慢慢看一遍。</p>' +
          '<button class="start-btn" type="button">翻开时光</button>' +
        '</div>';

    } else if (p.type === "end") {
      page.classList.add("page-end");
      page.innerHTML =
        '<div class="end-inner">' +
          '<div class="end-photo-wrap">' +
            '<div class="end-photo-ring">' +
              '<img src="' + p.img + '" alt="" ' +
                'onerror="this.style.opacity=\'0\';this.style.display=\'none\';">' +
            '</div>' +
          '</div>' +
          '<h1 class="end-big">' + p.bigTitle + '</h1>' +
          '<div class="end-rule"></div>' +
          '<div class="lines"></div>' +
          '<div class="end-actions">' +
            '<button class="end-btn primary egg-btn" type="button">观看彩蛋</button>' +
            '<button class="end-btn restart-btn" type="button">回到首页</button>' +
          '</div>' +
        '</div>';

    } else {
      page.innerHTML =
        '<div class="card">' +
          '<div class="photo-frame">' +
            '<div class="photo-inner">' +
              '<div class="photo-holder"><span>' + p.alt + '</span></div>' +
              '<img src="' + p.img + '" alt="" onerror="this.style.display=\'none\';">' +
            '</div>' +
          '</div>' +
          '<div class="text-area">' +
            '<h2 class="p-title">' + p.title + '</h2>' +
            '<div class="lines"></div>' +
          '</div>' +
        '</div>' +
        '<div class="hint">轻触继续</div>';
    }

    return page;
  }

  pages.forEach(function (p) {
    var el = buildPage(p);
    stage.appendChild(el);
    pageEls.push(el);
  });

  /* =========================================================
     4. 打字机
     ========================================================= */
  var typer = {
    lines: [],
    container: null,
    li: -1,
    ci: 0,
    timer: null,
    wait: null,
    current: null,
    currentText: "",
    done: true,
    onDone: null,

    start: function (lines, container, onDone) {
      this.stop();
      this.lines = lines;
      this.container = container;
      this.onDone = onDone;
      this.li = -1;
      this.ci = 0;
      this.done = false;
      this.current = null;
      this.currentText = "";
      this.nextLine();
    },

    stop: function () {
      if (this.timer) { clearInterval(this.timer); this.timer = null; }
      if (this.wait) { clearTimeout(this.wait); this.wait = null; }
    },

    nextLine: function () {
      var self = this;
      this.li++;

      if (this.li >= this.lines.length) {
        this.done = true;
        if (this.onDone) this.onDone();
        return;
      }

      var text = this.lines[this.li];
      this.currentText = text;

      if (text === "") {
        var blank = document.createElement("p");
        blank.className = "line";
        blank.innerHTML = "&nbsp;";
        blank.style.animationDuration = ".6s";
        this.container.appendChild(blank);
        this.current = blank;
        this.wait = setTimeout(function () { self.nextLine(); }, 220);
        return;
      }

      var p = document.createElement("p");
      p.className = "line typing";
      this.container.appendChild(p);
      this.current = p;
      this.ci = 0;

      this.timer = setInterval(function () {
        self.ci++;
        p.textContent = text.slice(0, self.ci);
        if (self.ci >= text.length) {
          clearInterval(self.timer);
          self.timer = null;
          p.classList.remove("typing");
          self.wait = setTimeout(function () { self.nextLine(); }, 520);
        }
      }, 62);
    },

    finishAll: function () {
      if (this.done || !this.lines.length) return;
      this.stop();

      if (this.current && this.currentText !== "") {
        this.current.textContent = this.currentText;
        this.current.classList.remove("typing");
      }

      for (var i = this.li + 1; i < this.lines.length; i++) {
        var p = document.createElement("p");
        p.className = "line";
        if (this.lines[i] === "") {
          p.innerHTML = "&nbsp;";
        } else {
          p.textContent = this.lines[i];
        }
        this.container.appendChild(p);
      }

      this.li = this.lines.length;
      this.done = true;
      if (this.onDone) this.onDone();
    }
  };

  /* =========================================================
     5. 页面切换
     ========================================================= */
  function revealEndActions(el) {
    var box = el.querySelector(".end-actions");
    if (box) box.classList.add("show");
  }

  function showPage(i) {
    currentIndex = i;

    pageEls.forEach(function (el, idx) {
      el.classList.toggle("active", idx === i);
    });

    var p = pages[i];
    var el = pageEls[i];
    var linesEl = el.querySelector(".lines");
    var hint = el.querySelector(".hint");

    if (hint) hint.classList.remove("show");
    if (startDelayTimer) { clearTimeout(startDelayTimer); startDelayTimer = null; }
    typer.stop();

    if (p.type === "end") {
      var box = el.querySelector(".end-actions");
      if (box) box.classList.remove("show");
    }

    waitingForTap = false;

    if (p.lines && p.lines.length && linesEl) {
      if (el.dataset.played === "1") {
        waitingForTap = true;
        if (hint) hint.classList.add("show");
        if (p.type === "end") revealEndActions(el);
        return;
      }
      el.dataset.played = "1";

      var delay = (p.type === "end") ? 1250 : 620;

      startDelayTimer = setTimeout(function () {
        typer.start(p.lines, linesEl, function () {
          waitingForTap = true;
          if (hint) hint.classList.add("show");
          if (p.type === "end") revealEndActions(el);
        });
      }, delay);

    } else {
      waitingForTap = true;
      if (hint) hint.classList.add("show");
    }
  }

  /* 初始化：显示封面 */
  pageEls[0].classList.add("active");

  /* =========================================================
     6. 回到首页
     ========================================================= */
  function goHome() {
    closeVideo();

    typer.stop();
    typer.lines = [];
    typer.done = true;

    if (startDelayTimer) { clearTimeout(startDelayTimer); startDelayTimer = null; }

    pageEls.forEach(function (el) {
      el.removeAttribute("data-played");
      var linesEl = el.querySelector(".lines");
      if (linesEl) linesEl.innerHTML = "";
      var hint = el.querySelector(".hint");
      if (hint) hint.classList.remove("show");
      var box = el.querySelector(".end-actions");
      if (box) box.classList.remove("show");
    });

    currentIndex = 0;
    started = false;
    waitingForTap = true;

    pageEls.forEach(function (el, idx) {
      el.classList.toggle("active", idx === 0);
    });

    var coverEl = pageEls[0];
    coverEl.classList.remove("active");
    void coverEl.offsetWidth;
    coverEl.classList.add("active");
  }

  /* =========================================================
     7. 交互
     ========================================================= */
  stage.addEventListener("click", function (e) {
    /* 观看彩蛋 */
    if (e.target.closest(".egg-btn")) {
      e.stopPropagation();
      openVideo();
      return;
    }

    /* 回到首页 */
    if (e.target.closest(".restart-btn")) {
      e.stopPropagation();
      goHome();
      return;
    }

    if (!started) return;
    if (e.target.closest(".start-btn")) return;

    if (!waitingForTap) {
      if (startDelayTimer) { clearTimeout(startDelayTimer); startDelayTimer = null; }
      var el = pageEls[currentIndex];
      var linesEl = el.querySelector(".lines");
      var hint = el.querySelector(".hint");
      var p = pages[currentIndex];

      if (linesEl && el.dataset.played === "1" && !typer.lines.length) {
        p.lines.forEach(function (t) {
          var node = document.createElement("p");
          node.className = "line";
          if (t === "") { node.innerHTML = "&nbsp;"; } else { node.textContent = t; }
          linesEl.appendChild(node);
        });
        typer.done = true;
        typer.lines = [];
        waitingForTap = true;
        if (hint) hint.classList.add("show");
        if (p.type === "end") revealEndActions(el);
      } else {
        typer.finishAll();
      }
      return;
    }

    if (currentIndex < pageEls.length - 1) {
      showPage(currentIndex + 1);
    }
  });

  /* 封面按钮 */
  var startBtn = document.querySelector(".start-btn");
  startBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (started) return;
    started = true;

    startMusic();

    var toggle = document.getElementById("musicToggle");
    toggle.classList.add("visible");

    showPage(1);
  });

  /* =========================================================
     8. 背景音乐（你自己的 mp3）
     ========================================================= */
  var bgm = document.getElementById("bgm");
  var musicToggle = document.getElementById("musicToggle");
  var musicOn = false;
  var fadeRaf = null;
  var TARGET_VOL = 0.55;

  if (bgm) {
    bgm.volume = 0;
  }

  function fadeVolume(to, dur, cb) {
    if (!bgm) { if (cb) cb(); return; }
    var from = bgm.volume;
    var startTime = (typeof performance !== "undefined" && performance.now)
      ? performance.now() : Date.now();

    if (fadeRaf) {
      if (typeof cancelAnimationFrame === "function") cancelAnimationFrame(fadeRaf);
      else clearTimeout(fadeRaf);
      fadeRaf = null;
    }

    function step() {
      var now = (typeof performance !== "undefined" && performance.now)
        ? performance.now() : Date.now();
      var t = Math.min((now - startTime) / dur, 1);
      var v = from + (to - from) * t;
      bgm.volume = Math.max(0, Math.min(1, v));

      if (t < 1) {
        if (typeof requestAnimationFrame === "function") {
          fadeRaf = requestAnimationFrame(step);
        } else {
          fadeRaf = setTimeout(step, 16);
        }
      } else {
        fadeRaf = null;
        if (cb) cb();
      }
    }

    if (typeof requestAnimationFrame === "function") {
      fadeRaf = requestAnimationFrame(step);
    } else {
      fadeRaf = setTimeout(step, 16);
    }
  }

  function updateMusicBtn() {
    musicToggle.classList.toggle("off", !musicOn);
  }

  function startMusic() {
    if (!bgm) return;
    var p = bgm.play();
    if (p && typeof p.then === "function") {
      p.then(function () {
        musicOn = true;
        updateMusicBtn();
        fadeVolume(TARGET_VOL, 2400);
      }).catch(function () {
        musicOn = false;
        updateMusicBtn();
      });
    } else {
      musicOn = true;
      updateMusicBtn();
      fadeVolume(TARGET_VOL, 2400);
    }
  }

  function stopMusic() {
    if (!bgm) return;
    musicOn = false;
    updateMusicBtn();
    fadeVolume(0, 700, function () {
      if (bgm) bgm.pause();
    });
  }

  function duckMusic() {
    if (!bgm || !musicOn) return;
    fadeVolume(0, 500);
  }

  function unduckMusic() {
    if (!bgm || !musicOn) return;
    fadeVolume(TARGET_VOL, 900);
  }

  musicToggle.addEventListener("click", function (e) {
    e.stopPropagation();
    if (musicOn) {
      stopMusic();
    } else {
      startMusic();
    }
  });

  /* 页面切到后台时暂停，回来再恢复 */
  document.addEventListener("visibilitychange", function () {
    if (!bgm) return;
    if (document.hidden) {
      if (musicOn && !bgm.paused) bgm.pause();
    } else {
      if (musicOn && bgm.paused) {
        var p = bgm.play();
        if (p && p.catch) p.catch(function () {});
      }
    }
  });

  /* =========================================================
     9. 彩蛋视频
     ========================================================= */
  var videoModal = document.getElementById("videoModal");
  var eggVideo = document.getElementById("eggVideo");
  var videoClose = videoModal ? videoModal.querySelector(".video-close") : null;

  function openVideo() {
    if (!videoModal) return;
    videoModal.classList.add("open");
    duckMusic();

    if (eggVideo) {
      try { eggVideo.currentTime = 0; } catch (err) {}
      var p = eggVideo.play();
      if (p && typeof p.catch === "function") p.catch(function () {});
    }
  }

  function closeVideo() {
    if (!videoModal) return;
    if (!videoModal.classList.contains("open")) return;

    videoModal.classList.remove("open");

    if (eggVideo) {
      try { eggVideo.pause(); } catch (err) {}
      try { eggVideo.currentTime = 0; } catch (err) {}
    }

    unduckMusic();
  }

  if (videoClose) {
    videoClose.addEventListener("click", function (e) {
      e.stopPropagation();
      closeVideo();
    });
  }

  if (videoModal) {
    videoModal.addEventListener("click", function (e) {
      if (e.target === videoModal) closeVideo();
    });
  }

  if (eggVideo) {
    eggVideo.addEventListener("ended", function () {
      closeVideo();
    });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeVideo();
  });

})();
</script>
